name: 채용공고 확인

on:
  schedule:
    # UTC 기준. 한국시간 08~22시 사이 2시간마다 (KST = UTC+9)
    - cron: "0 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 공고 확인 및 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python check_jobs.py
      - name: 상태 저장
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen.json docs/matches.json status.json
          git diff --cached --quiet || git commit -m "상태 갱신 $(date -u +%F' '%H:%M)"
          git push
